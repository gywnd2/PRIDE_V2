; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Guition_JC8048W550]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
framework = arduino
board = Guition_JC8048W550
lib_deps =
	lvgl/lvgl@8.3.11
	powerbroker2/ELMDuino@^3.4.1
	dfrobot/DFRobotDFPlayerMini@^1.0.6
	moononournation/GFX Library for Arduino@^1.6.4
	https://github.com/mmMicky/TouchLib.git
	h2zero/NimBLE-Arduino@^2.3.7
	bblanchon/ArduinoJson@^6.21.4
	bitbank2/AnimatedGIF@^2.1.0
build_flags =
	-I include
	-I include/ui
	-DLVGL_H_INCLUDE_SIMPLE
	-DLV_CONF_INCLUDE_SIMPLE
	-DLVGL_TFT_DISPLAY_CONTROLLER=LVGL_TFT_DISPLAY_CONTROLLER_GUITION_JC8048W550
	-DLVGL_TFT_DISPLAY_ORIENTATION=LVGL_TFT_DISPLAY_ORIENTATION_LANDSCAPE
	-DLVGL_TFT_DISPLAY_WIDTH=800
	-DLVGL_TFT_DISPLAY_HEIGHT=480
	-DLVGL_TFT_DISPLAY_BUFFER_SIZE=8192
	-DST7262_PANEL_CONFIG_TIMINGS_PCLK_HZ=(16*1000000)
	-DARDUINO_GFX_RGB_PANEL_NUM_FBS=2
	-DARDUINO_GFX_RGB_BOUNCE_BUFFER_PIXELS=(LVGL_TFT_DISPLAY_WIDTH*10)
	-DDISPLAY_RGB_BOUNCE_BUFFER_PIXELS=(LVGL_TFT_DISPLAY_WIDTH*10)
	-DBOARD_HAS_PSRAM


	-mfix-esp32-psram-cache-issue
monitor_speed = 115200
board_build.arduino.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/load_wifi_credentials.py

